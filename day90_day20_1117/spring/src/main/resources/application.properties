spring.application.name=spring

# 1. 내장 톰캣 포트 번호 (React:5173 , Spring:8080 , FastAPI:8000)
server.port=8080

# 2. FastAPI(AI 추론 서버) 주소 , 서비스에서 @Value("${fastapi.url}") 로 불러오기
fastapi.url=http://127.0.0.1:8000

# 3. SSE 스트림 응답 최대 대기 시간(밀리초) , 기본값보다 길게 설정하여 중계 도중 끊김 방지
spring.mvc.async.request-timeout=60000
